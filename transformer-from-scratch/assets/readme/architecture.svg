<text x="286" y="115" fill="#b9c9e7" font-family="system-ui,sans-serif" font-size="13" font-weight="500">Shared byte-level BPE</text>
<path d="M487 102 L505 102" stroke="#7da9ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="508" y="70" width="214" height="64" rx="10" fill="#1c2c49" stroke="#4e6998"/>
<text x="521" y="94" fill="#edf3ff" font-family="system-ui,sans-serif" font-size="16" font-weight="650">Source embeddings</text>
<text x="521" y="115" fill="#b9c9e7" font-family="system-ui,sans-serif" font-size="13" font-weight="500">Add sinusoidal positions</text>
<path d="M722 102 L740 102" stroke="#7da9ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="743" y="70" width="214" height="64" rx="10" fill="#1c2c49" stroke="#4e6998"/>
