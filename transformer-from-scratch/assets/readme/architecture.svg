<svg xmlns="http://www.w3.org/2000/svg" width="960" height="444" viewBox="0 0 960 444" role="img" aria-labelledby="title desc">
  <title id="title">Encoder–decoder Transformer architecture</title>
  <desc id="desc">Source tokens become embeddings with sinusoidal positions and pass through two encoder blocks. Two decoder blocks read the target prefix and cross-attend to the encoder states. A vocabulary projection scores the next token, which is appended to the prefix during generation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8eb4ff"/>
    </marker>
  </defs>
  <rect width="960" height="444" rx="16" fill="#101a2e"/>
  <g font-family="system-ui, sans-serif" fill="#eef4ff">
    <text x="30" y="46" font-size="28" font-weight="700">Encoder–decoder Transformer</text>
    <text x="30" y="73" font-size="16" fill="#b6c8e8">4 heads × 32 channels · model width 128 · ReLU feed-forward width 384</text>
    <g fill="#1c2c49" stroke="#5572a1">
      <rect x="30" y="105" width="190" height="86" rx="10"/>
      <rect x="250" y="105" width="205" height="86" rx="10"/>
      <rect x="485" y="105" width="270" height="86" rx="10"/>
      <rect x="785" y="105" width="145" height="86" rx="10"/>
      <rect x="30" y="243" width="190" height="99" rx="10"/>
      <rect x="250" y="243" width="205" height="99" rx="10"/>
      <rect x="485" y="243" width="270" height="99" rx="10"/>
      <rect x="785" y="243" width="145" height="99" rx="10"/>
    </g>
    <g font-size="18" font-weight="650">
      <text x="44" y="134">Source tokens</text>
      <text x="264" y="134">Source embeddings</text>
      <text x="499" y="134">2 encoder blocks</text>
      <text x="799" y="134">Encoder states</text>
      <text x="44" y="272">Target prefix</text>
      <text x="264" y="272">Target embeddings</text>
      <text x="499" y="272">2 decoder blocks</text>
      <text x="799" y="272">Projection</text>
    </g>
    <g font-size="15" fill="#c6d5ee">
      <text x="44" y="161">Byte-level BPE</text>
      <text x="264" y="161">Add sinusoidal positions</text>
      <text x="499" y="158">Self-attention · padding mask</text>
      <text x="499" y="178">Feed-forward network</text>
      <text x="799" y="161">Cross-attention K, V</text>
      <text x="44" y="298">BOS + preceding tokens</text>
      <text x="264" y="298">Add sinusoidal positions</text>
      <text x="499" y="296">Self-attention · causal mask</text>
      <text x="499" y="318">Cross-attention + feed-forward</text>
      <text x="799" y="298">Vocabulary logits</text>
      <text x="799" y="318">Greedy or beam</text>
    </g>
    <g fill="none" stroke="#8eb4ff" stroke-width="2" marker-end="url(#arrow)">
      <path d="M220 148H247"/><path d="M455 148H482"/><path d="M755 148H782"/>
      <path d="M857 191V217H620V240"/>
      <path d="M220 292H247"/><path d="M455 292H482"/><path d="M755 292H782"/>
      <path d="M857 342V380H125V345"/>
    </g>
    <text x="260" y="411" font-size="16" fill="#b6c8e8">Autoregressive generation appends each selected token until EOS or the length cap.</text>
  </g>
</svg>
