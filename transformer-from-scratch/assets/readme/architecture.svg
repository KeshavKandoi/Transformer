<rect x="508" y="192" width="214" height="64" rx="10" fill="#1c2c49" stroke="#4e6998"/>
<text x="521" y="216" fill="#edf3ff" font-family="system-ui,sans-serif" font-size="16" font-weight="650">Transformer decoder</text>
<text x="521" y="237" fill="#b9c9e7" font-family="system-ui,sans-serif" font-size="13" font-weight="500">2 blocks · cross-attention</text>
<path d="M722 224 L740 224" stroke="#7da9ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
