<text x="286" y="359" fill="#edf3ff" font-family="system-ui,sans-serif" font-size="16" font-weight="650">Evaluation</text>
<text x="286" y="380" fill="#b9c9e7" font-family="system-ui,sans-serif" font-size="13" font-weight="500">Greedy frozen splits</text>
