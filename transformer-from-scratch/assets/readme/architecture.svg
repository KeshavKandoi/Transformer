<text x="756" y="115" fill="#b9c9e7" font-family="system-ui,sans-serif" font-size="13" font-weight="500">2 blocks · encoder states</text>
<rect x="38" y="192" width="214" height="64" rx="10" fill="#1c2c49" stroke="#4e6998"/>
<text x="51" y="216" fill="#edf3ff" font-family="system-ui,sans-serif" font-size="16" font-weight="650">Hindi prefix</text>
<text x="51" y="237" fill="#b9c9e7" font-family="system-ui,sans-serif" font-size="13" font-weight="500">BOS + generated tokens</text>
<path d="M252 224 L270 224" stroke="#7da9ff" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="273" y="192" width="214" height="64" rx="10" fill="#1c2c49" stroke="#4e6998"/>
<text x="286" y="216" fill="#edf3ff" font-family="system-ui,sans-serif" font-size="16" font-weight="650">Target embeddings</text>
<text x="286" y="237" fill="#b9c9e7" font-family="system-ui,sans-serif" font-size="13" font-weight="500">Add sinusoidal positions</text>
