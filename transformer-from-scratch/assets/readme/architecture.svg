<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">System architecture</title><desc id="desc">Training produces a checkpoint. Inference uses it to encode English and generate Hindi one token at a time.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#7da9ff"/></marker></defs>
<rect width="1000" height="430" rx="18" fill="#101a2e"/>
<text x="38" y="45" fill="#9fc1ff" font-family="system-ui,sans-serif" font-size="19" font-weight="700">MODEL DATA FLOW</text>
<rect x="38" y="70" width="214" height="64" rx="10" fill="#1c2c49" stroke="#4e6998"/>
<text x="51" y="94" fill="#edf3ff" font-family="system-ui,sans-serif" font-size="16" font-weight="650">English source</text>
<text x="51" y="115" fill="#b9c9e7" font-family="system-ui,sans-serif" font-size="13" font-weight="500">Normalized text</text>
