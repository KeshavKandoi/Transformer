training:
  # Set the modeled budget explicitly at launch. The prep release uses one epoch.
  epochs: 1
  batch_size: 8
  gradient_accumulation_steps: 4
  seed: 173
  device: cpu
  deterministic_algorithms: true
  optimizer:
    learning_rate: 0.0003
  scheduler:
    type: inverse_sqrt
    warmup_fraction: 0.05
  max_grad_norm: 1.0
  label_smoothing: 0.0
  save_every_updates: 250
  early_stopping:
    enabled: false
